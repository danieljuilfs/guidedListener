<head>    
    <link rel="stylesheet" href="test.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script type="module" src="test.js"></script>

</head>

<body>
 <div id="playbackGrid">
        <div id="pbContainer">
            <div id="identifiers">
                <h1 id="composer"></h1>
                <div id="trackName"></div>
                <div id="timers">
                    <div id="pbTime">0:00</div> 
                    <div>/</div>
                    <div id="duration">0:00</div>
                </div>
            </div>
            <div id="sections"></div>
            <div id="controls">
                <button id="playButton" type="button" disabled><span class="material-icons" id="playBtn" style="cursor: pointer;">play_arrow</span></button>
                <div id="clickTrack" style="cursor: pointer;">
                    <div id="track">
                        <div id="progress"></div>
                        <div id="slider" style="cursor: pointer;"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="bottom">
            <div id="notes"></div>
            <a id="album"></a>
        </div>
        
    </div>
<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
</body>
