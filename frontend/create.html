<html lang="en">
    <head>    
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="create.css">
        <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
        <script type="module" src="create.js"></script>
    </head>

    <body>
        <div id="trackSetup">
            <form>
                <legend>Listener Type</legend>
                <div>
                    <input type="radio" name="typeSelect" id="vocal" value="vocal">
                    <label for="vocal">Vocal Listener</label>
                    <input type="radio" name="typeSelect" id="instrumental" value="instrumental">
                    <label for="instrumental">Instrumental Listener</label>
                </div>
            </form>
            <div id="addTrack">
                <div>
                    <label id="tracklabel">Track Link</label>
                    <input type="text" id="trackLink" placeholder="Enter Apple Music URL here"></input>
                    <button id="loadTrack">Create Listener</button>
                </div>
            </div>
        </div>
        <div id="customizeTrack">
            <div id="composer">
                <label id="composerLabel" class="label">Composer</label>
                <input type="text" id="composerInput" title="Change the displayed composer at the top of the guided listener"></input>
            </div>
            <div id="trackName">
                <label id="trackLabel" class="label" >Title</label>
                <input type="text" id="trackInput" title="Change the title displayed on the guided listener"></input>
            </div>
        </div>

        <div id="topButtons">
            <div id="addSection" class="disabledDiv">+section</div>
            <div id="removeSection" class="disabledDiv">-section</div>
            <div id="addComment" class="disabledDiv">+comment</div>
            <div id="removeComment" class="disabledDiv">-comment</div>
            <div id="addKey" class="disabledDiv">+key</div>
            <div id="removeKey" class="disabledDiv">-key</div>
        </div>

        <div id="sections">
        </div>
        <div id="keyBar">
        </div>

        <div id="bottom">
            <div id="createSection">
                <div id="notes" contenteditable=""></div>
                <div id="translation" contentEditable=""></div>
            </div>
        </div>
        <div id="playback">
            <div id="controls">
                <button id="playButton" type="button" disabled><span class="material-icons" id="playBtn" style="cursor: pointer;">play_arrow</span></button>
                <div id="clickTrack" style="cursor: pointer;">
                    <div id="track">
                        <div id="progress"></div>
                        <div id="slider" style="cursor: pointer;"></div>
                    </div>
                </div>
            </div>
            <div id="timers">
                <div id="pbTime">0:00</div> 
                <div id="duration">0:00</div>
            </div>
        </div>
    </body>
</html>
